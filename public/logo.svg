<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="#fff" stroke-width="4"/>

  <!-- Robot/Byte character - Center -->
  <!-- Body -->
  <rect x="196" y="220" width="120" height="100" rx="20" fill="#f0f0f0" opacity="0.95"/>
  <!-- Screen face -->
  <rect x="211" y="230" width="90" height="50" rx="12" fill="#1e1b4b"/>
  <!-- Eyes (pixel style) -->
  <rect x="228" y="245" width="16" height="16" rx="3" fill="#34d399"/>
  <rect x="268" y="245" width="16" height="16" rx="3" fill="#34d399"/>
  <!-- Mouth / Smile -->
  <rect x="238" y="265" width="36" height="6" rx="3" fill="#34d399"/>
  <!-- Antenna -->
  <rect x="248" y="170" width="16" height="50" rx="8" fill="#fbbf24"/>
  <circle cx="256" cy="165" r="18" fill="#fbbf24"/>
  <circle cx="256" cy="165" r="10" fill="#f59e0b"/>
  <!-- Antenna glow -->
  <circle cx="256" cy="165" r="22" fill="#fbbf24" opacity="0.3"/>
  <!-- Ears -->
  <rect x="176" y="240" width="24" height="30" rx="8" fill="#a78bfa"/>
  <rect x="312" y="240" width="24" height="30" rx="8" fill="#a78bfa"/>
  <!-- Arms -->
  <rect x="176" y="250" width="20" height="60" rx="10" fill="#c4b5fd"/>
  <rect x="316" y="250" width="20" height="60" rx="10" fill="#c4b5fd"/>
  <!-- Hands -->
  <circle cx="186" cy="315" r="12" fill="#a78bfa"/>
  <circle cx="326" cy="315" r="12" fill="#a78bfa"/>
  <!-- Legs -->
  <rect x="216" y="315" width="20" height="40" rx="10" fill="#c4b5fd"/>
  <rect x="276" y="315" width="20" height="40" rx="10" fill="#c4b5fd"/>
  <!-- Feet -->
  <rect x="211" y="350" width="30" height="15" rx="7" fill="#a78bfa"/>
  <rect x="271" y="350" width="30" height="15" rx="7" fill="#a78bfa"/>
  <!-- Chest code lines -->
  <rect x="226" y="300" width="20" height="4" rx="2" fill="#818cf8" opacity="0.5"/>
  <rect x="254" y="300" width="30" height="4" rx="2" fill="#818cf8" opacity="0.5"/>
  <rect x="226" y="308" width="14" height="4" rx="2" fill="#818cf8" opacity="0.3"/>
  <rect x="248" y="308" width="36" height="4" rx="2" fill="#818cf8" opacity="0.3"/>
</svg>
